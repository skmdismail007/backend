services:
  - type: web
    name: nexora-backend
    env: node
    plan: free

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: MONGODB_URI
        sync: false

      - key: MONGODB_CONNECTION_TIMEOUT_MS
        value: "10000"

      - key: API_BASE_URL
        value: https://backend-3mp3.onrender.com/api

      - key: CORS_ORIGIN
        sync: false