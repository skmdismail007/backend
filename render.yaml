# Render Deployment Configuration
# Save as: render.yaml in root of backend folder
# This helps automate deployment settings

services:
  - type: web
    name: backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: API_BASE_URL
        value: https://backend-3mp3.onrender.com/api
