# Render Deployment Configuration
# Save as: render.yaml in root of backend folder
# This helps automate deployment settings

services:
  - type: web
    name: nexora-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://your-frontend.onrender.com
      - key: FIREBASE_API_KEY
        value: AIzaSyCJ3dtb_nv5zstIVtRgbDbvoJQE7e3cPN4
