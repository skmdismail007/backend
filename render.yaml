# Render Deployment Configuration
# Save as: render.yaml in root of backend folder
# This helps automate deployment settings

services:
  - type: web
    name: nexora-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://your-frontend.onrender.com,http://localhost:5173,http://localhost:5174
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: API_BASE_URL
        value: https://backend-3mp3.onrender.com/api
