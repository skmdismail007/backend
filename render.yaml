        value: ebackend-66bde.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: ebackend-66bde
      - key: FIREBASE_STORAGE_BUCKET
        value: ebackend-66bde.firebasestorage.app
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "172774872527"
      - key: FIREBASE_APP_ID
        value: 1:172774872527:web:a1ed1f7ca9c0499aff6eba
      - key: FIREBASE_MEASUREMENT_ID
        value: G-5EDHEHCKQN
